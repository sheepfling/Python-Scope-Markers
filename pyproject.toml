[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-markers"
description = "Insert standalone #### comments at Python compound-statement boundaries"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = []

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "black>=24",
    "build>=1.2",
    "flake8>=7",
    "pyright>=1.1.390",
    "pytest>=8",
    "rumdl>=0.2.49,<0.3",
    "ruff>=0.9",
]

[project.scripts]
scope-markers = "scope_markers.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.1.0"
version_scheme = "no-guess-dev"

[tool.pytest.ini_options]
# Tests do not use --lf/--ff or pytest's cache fixture. Disabling the cache
# provider avoids shared-directory races when PyCharm and CI-style runs overlap
# on Windows.
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff.lint]
select = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
